<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡帕多奇亚热气球放飞站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'PingFang SC', 'Microsoft Yahei', sans-serif;
        }

        /* 天空背景 - 卡帕多奇亚日出渐变 */
        #sky {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, 
                #1E88E5 0%, 
                #64B5F6 35%, 
                #BBDEFB 65%, 
                #FFCC80 85%, 
                #FFAB91 100%);
        }

        /* 底部喀斯特地貌 */
        #sky::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22vh;
            background: linear-gradient(to top, #A1887F, #D7CCC8);
            clip-path: polygon(
                0% 75%, 4% 68%, 9% 72%, 14% 63%, 19% 67%, 24% 58%, 
                29% 62%, 34% 53%, 39% 57%, 44% 48%, 49% 52%, 54% 43%, 
                59% 47%, 64% 38%, 69% 42%, 74% 33%, 79% 37%, 84% 28%, 
                89% 32%, 94% 23%, 100% 27%, 100% 100%, 0% 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* 热气球容器 */
        .balloon {
            position: absolute;
            z-index: 2;
            /* 上下摇摆模拟气流 */
            animation: sway 5s ease-in-out infinite;
            will-change: left, top, z-index;
        }

        /* 热气球气囊 - 真实造型优化 */
        .balloon-envelope {
            position: relative;
            width: var(--size);
            height: calc(var(--size) * 1.3); /* 真实比例1:1.3 */
            border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; /* 上大下小流畅弧线 */
            background: var(--bg);
            box-shadow: 
                inset -15px -15px 30px rgba(0,0,0,0.12), /* 内部暗部模拟厚度 */
                0 8px 20px rgba(0,0,0,0.15); /* 外部投影 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 气囊高光 */
        .balloon-envelope::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 10%;
            width: 25%;
            height: 35%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(8px);
            z-index: 1;
            pointer-events: none;
        }

        /* 气囊底部收口 */
        .balloon-envelope::after {
            content: '';
            position: absolute;
            bottom: -6%;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--size) * 0.15);
            height: calc(var(--size) * 0.08);
            background: inherit;
            border-radius: 0 0 4px 4px;
            z-index: 1;
            pointer-events: none;
        }

        /* 热气球文字 */
        .balloon-text {
            position: relative;
            color: #fff;
            font-weight: bold;
            font-size: calc(var(--size) * 0.15);
            text-align: center;
            width: 90%;
            word-wrap: break-word;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            z-index: 2;
            pointer-events: none;
        }

        /* 连接绳 */
        .balloon-rope {
            width: 1px;
            height: calc(var(--size) * 0.18);
            background: #666;
            margin: 0 auto;
        }

        /* 吊篮 */
        .balloon-basket {
            width: calc(var(--size) * 0.25);
            height: calc(var(--size) * 0.18);
            background: #8D6E63;
            border-top: 2px solid #5D4037; /* 篮子顶部边缘 */
            border-radius: 2px;
            margin: 0 auto;
            box-shadow: 0 3px 6px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        /* 合并次数显示 */
        .merge-count {
            color: #fff;
            font-size: calc(var(--size) * 0.08);
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 待合并状态篮子闪烁 */
        .balloon.pending-merge .balloon-basket {
            animation: basketPulse 0.8s ease-in-out infinite alternate;
        }

        /* ===== 右上角排行榜样式 ===== */
        #ranking-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 220px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            transition: all 0.3s ease;
        }

        /* 排行榜折叠状态 */
        #ranking-panel.collapsed {
            width: auto;
            border-radius: 50px;
        }

        #ranking-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        #ranking-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
        }

        #toggle-ranking {
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        #ranking-panel.collapsed #toggle-ranking {
            transform: rotate(180deg);
        }

        #ranking-list {
            max-height: 300px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }

        #ranking-panel.collapsed #ranking-list {
            height: 0;
            opacity: 0;
            overflow: hidden;
            margin: 0;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.3);
            font-size: 14px;
        }

        .ranking-item:last-child {
            margin-bottom: 0;
        }

        .ranking-index {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #7f8c8d;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 前三名特殊颜色 */
        .ranking-item:nth-child(1) .ranking-index { background: #f1c40f; }
        .ranking-item:nth-child(2) .ranking-index { background: #bdc3c7; }
        .ranking-item:nth-child(3) .ranking-index { background: #d35400; }

        .ranking-text {
            flex: 1;
            margin: 0 8px;
            color: #2c3e50;
            font-weight: 500;
        }

        .ranking-count {
            color: #e74c3c;
            font-weight: bold;
        }

        /* 滚动条美化 */
        #ranking-list::-webkit-scrollbar {
            width: 4px;
        }
        #ranking-list::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 2px;
        }
        #ranking-list::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 2px;
        }

        /* 底部输入区域 */
        #input-area {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(12px);
            padding: 15px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        #input-area input {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            width: 300px;
            outline: none;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            transition: all 0.3s;
        }

        #input-area input:focus {
            box-shadow: 0 0 0 3px rgba(255, 112, 67, 0.3);
        }

        #input-area button {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background: #FF7043;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        #input-area button:hover {
            background: #F4511E;
            transform: translateY(-1px);
        }

        /* 摇摆动画 */
        @keyframes sway {
            0% { transform: translateY(-4px); }
            50% { transform: translateY(4px); }
            100% { transform: translateY(-4px); }
        }

        /* 篮子闪烁动画 */
        @keyframes basketPulse {
            0% { background: #8D6E63; }
            100% { background: #FFA726; }
        }

        /* 合并消失动画 */
        .balloon.merging {
            animation: merge 0.5s ease forwards;
        }

        @keyframes merge {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 新气球入场动画 */
        .balloon.new {
            animation: newBalloon 0.5s ease forwards, sway 5s ease-in-out infinite;
        }

        @keyframes newBalloon {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            #ranking-panel {
                width: 180px;
                top: 10px;
                right: 10px;
            }
            #ranking-title {
                font-size: 14px;
            }
            .ranking-item {
                font-size: 12px;
            }
            #input-area {
                width: 90%;
            }
            #input-area input {
                flex: 1;
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div id="sky"></div>

    <!-- 右上角合成排行榜 -->
    <div id="ranking-panel">
        <div id="ranking-header">
            <div id="ranking-title">🔥 合成排行榜</div>
            <button id="toggle-ranking">∧</button>
        </div>
        <div id="ranking-list"></div>
    </div>

    <!-- 底部输入区域 -->
    <div id="input-area">
        <input type="text" id="balloon-text" placeholder="写下你想放飞的文字..." maxlength="8">
        <button id="fly-btn">放飞热气球</button>
    </div>

    <script>
        // 配置参数（可自行修改）
        const CONFIG = {
            maxBalloons: 45,          // 最大同时存在的气球数量
            minSize: 60,              // 最小气球尺寸
            maxSize: 230,             // 最大气球尺寸上限
            floatSpeed: 0.2,          // 统一随风飘动速度（所有气球相同，慢速）
            riseSpeed: 1.2,           // 新气球上升速度
            mergeDistance: 25,        // 合并触发距离
            baseAttractFactor: 0.005, // 基础吸引强度
            mergeScale: 1.2,          // 合并后尺寸放大系数
            mergeWaitTime: 3000,      // 合并等待时间（3秒）
            minHeight: 0.15,          // 最大气球的最低高度（窗口占比，越接近0越高）
            maxHeight: 0.65           // 最小气球的最高高度（窗口占比，越接近1越低）
        };

        // 热气球配色库
        const COLORS = [
            '#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE', '#448AFF', 
            '#40C4FF', '#18FFFF', '#64FFDA', '#69F0AE', '#B2FF59', '#EEFF41', 
            '#FFFF00', '#FFD740', '#FFAB40', '#FF6E40'
        ];

        // 初始默认气球文字
        const DEFAULT_TEXTS = [
            '浪漫', '自由', '旅行', '平安', '喜乐', '暴富', '健康', '好运', 
            '开心', '顺遂', '温柔', '热爱', '梦想', '远方', '治愈', '温暖',
            '勇气', '希望', '未来', '美好', '上岸', '脱单', '加薪', '顺利'
        ];

        const sky = document.getElementById('sky');
        const input = document.getElementById('balloon-text');
        const flyBtn = document.getElementById('fly-btn');
        const rankingPanel = document.getElementById('ranking-panel');
        const toggleRanking = document.getElementById('toggle-ranking');
        const rankingList = document.getElementById('ranking-list');
        
        let balloons = [];
        let winWidth = window.innerWidth;
        let winHeight = window.innerHeight;
        // 排行榜更新防抖
        let updateRankingTimer = null;

        // HTML转义防XSS
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, char => ({ 
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' 
            }[char]));
        }

        // 随机获取颜色
        function getRandomColor() {
            return COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // 生成热气球背景（3种样式）
        function getBalloonBg() {
            const type = Math.floor(Math.random() * 3);
            const c1 = getRandomColor();
            const c2 = getRandomColor();
            
            switch(type) {
                case 0: return `linear-gradient(135deg, ${c1}, ${c2})`;
                case 1: return `repeating-linear-gradient(to bottom, ${c1} 0px, ${c1} 12px, ${c2} 12px, ${c2} 24px)`;
                case 2: return `repeating-linear-gradient(to right, ${c1} 0px, ${c1} 12px, ${c2} 12px, ${c2} 24px)`;
            }
        }

        // 计算两点距离
        function getDistance(x1, y1, x2, y2) {
            return Math.sqrt(Math.pow(x1 - x2, 2) + Math.pow(y1 - y2, 2));
        }

        // 【仅用于吸引速度】根据尺寸计算吸引速度，同等大小速度相同，越大越慢
        function getAttractSpeedBySize(size) {
            const ratio = (size - CONFIG.minSize) / (CONFIG.maxSize - CONFIG.minSize);
            // 最小尺寸的吸引速度固定为1倍，越大速度越低
            return 1 - ratio * 0.7;
        }

        // 【动态高度计算】根据气球尺寸计算悬浮高度，越大越高，不到顶部
        function getTargetYBySize(size) {
            const ratio = (size - CONFIG.minSize) / (CONFIG.maxSize - CONFIG.minSize);
            // 尺寸越大，高度占比越小（越靠上），范围minHeight~maxHeight
            const heightRatio = CONFIG.maxHeight - ratio * (CONFIG.maxHeight - CONFIG.minHeight);
            return heightRatio * winHeight;
        }

        // 清除待合并状态
        function clearPending(balloon) {
            if (balloon.mergeTimer) {
                clearTimeout(balloon.mergeTimer);
                balloon.mergeTimer = null;
            }
            balloon.pendingMerge = null;
            balloon.element.classList.remove('pending-merge');
        }

        // 更新气球层级和尺寸属性
        function updateBalloonProps(balloon) {
            // 层级反转：越小越靠前，z-index越高，越大越靠后
            const zIndex = Math.floor(CONFIG.maxSize - balloon.size);
            balloon.element.style.zIndex = zIndex;
            balloon.element.style.setProperty('--size', `${balloon.size}px`);
        }

        // ===== 排行榜更新函数 =====
        function updateRanking() {
            // 防抖：300ms内多次触发只更新一次
            clearTimeout(updateRankingTimer);
            updateRankingTimer = setTimeout(() => {
                // 按文字分组统计最大合成次数
                const textMap = {};
                balloons.forEach(b => {
                    if (!textMap[b.text] || b.mergeCount > textMap[b.text]) {
                        textMap[b.text] = b.mergeCount;
                    }
                });

                // 转换为数组并排序：先按次数降序，次数相同按拼音首字母升序
                const rankingArr = Object.entries(textMap)
                    .map(([text, count]) => ({ text, count }))
                    .sort((a, b) => {
                        if (b.count !== a.count) {
                            return b.count - a.count;
                        }
                        // 中文拼音排序，英文自动按首字母
                        return a.text.localeCompare(b.text, 'zh-CN');
                    });

                // 渲染列表
                rankingList.innerHTML = rankingArr.map((item, index) => `
                    <div class="ranking-item">
                        <div class="ranking-index">${index + 1}</div>
                        <div class="ranking-text">${escapeHtml(item.text)}</div>
                        <div class="ranking-count">${item.count}</div>
                    </div>
                `).join('');
            }, 300);
        }

        // 创建单个热气球
        function createBalloon(text, options = {}) {
            // 超过最大数量删除最早的气球
            if (balloons.length >= CONFIG.maxBalloons) {
                const removed = balloons.shift();
                clearPending(removed);
                removed.element.remove();
            }

            const size = options.size || CONFIG.minSize + Math.random() * 40;
            const element = document.createElement('div');
            element.className = 'balloon ' + (options.isNew ? 'new' : '');
            element.style.setProperty('--bg', getBalloonBg());
            element.style.animationDelay = `${Math.random() * 5}s`; // 随机摇摆偏移更自然

            const mergeCount = options.mergeCount || 1;

            element.innerHTML = `
                <div class="balloon-envelope">
                    <div class="balloon-text">${escapeHtml(text)}</div>
                </div>
                <div class="balloon-rope"></div>
                <div class="balloon-basket">
                    <span class="merge-count">${mergeCount}</span>
                </div>
            `;

            const balloon = {
                id: Date.now() + Math.random(),
                element,
                text,
                size,
                mergeCount,
                direction: Math.random() > 0.5 ? 1 : -1, // 初始飘动方向
                x: options.x || Math.random() * (winWidth - size),
                y: options.y || winHeight,
                // 根据尺寸动态计算目标高度，越大越高
                targetY: options.targetY || getTargetYBySize(size),
                isRising: options.isRising !== false,
                pendingMerge: null,
                mergeTimer: null
            };

            updateBalloonProps(balloon);
            element.style.left = `${balloon.x}px`;
            element.style.top = `${balloon.y}px`;

            sky.appendChild(element);
            balloons.push(balloon);
            
            // 新增气球后更新排行榜
            updateRanking();
            return balloon;
        }

        // 处理吸引和合并逻辑
        function handleMerge() {
            const groups = {};
            balloons.forEach(b => {
                if (!b.pendingMerge && !b.element.classList.contains('merging')) {
                    groups[b.text] = groups[b.text] || [];
                    groups[b.text].push(b);
                }
            });

            Object.values(groups).forEach(group => {
                if (group.length < 2) return;

                for (let i = 0; i < group.length; i++) {
                    const b1 = group[i];
                    for (let j = i + 1; j < group.length; j++) {
                        const b2 = group[j];
                        if (b1.pendingMerge || b2.pendingMerge) continue;

                        // 全屏相互吸引
                        const dx = b2.x - b1.x;
                        const dy = b2.y - b1.y;
                        const distance = getDistance(b1.x, b1.y, b2.x, b2.y);

                        // 同等大小吸引速度相同，越大吸引越慢
                        const b1AttractSpeed = getAttractSpeedBySize(b1.size);
                        const b2AttractSpeed = getAttractSpeedBySize(b2.size);
                        
                        b1.x += dx * CONFIG.baseAttractFactor * b1AttractSpeed;
                        b1.y += dy * CONFIG.baseAttractFactor * b1AttractSpeed;
                        b2.x -= dx * CONFIG.baseAttractFactor * b2AttractSpeed;
                        b2.y -= dy * CONFIG.baseAttractFactor * b2AttractSpeed;

                        // 进入合并倒计时
                        if (distance < CONFIG.mergeDistance) {
                            b1.pendingMerge = b2;
                            b2.pendingMerge = b1;
                            b1.element.classList.add('pending-merge');
                            b2.element.classList.add('pending-merge');

                            const timer = setTimeout(() => {
                                if (
                                    balloons.includes(b1) && balloons.includes(b2) &&
                                    b1.pendingMerge === b2 && b2.pendingMerge === b1
                                ) {
                                    // 执行合并动画
                                    b1.element.classList.add('merging');
                                    b2.element.classList.add('merging');

                                    setTimeout(() => {
                                        // 删除旧气球
                                        balloons = balloons.filter(b => b.id !== b1.id && b.id !== b2.id);
                                        b1.element.remove();
                                        b2.element.remove();

                                        // 生成新气球
                                        const newSize = Math.min(CONFIG.maxSize, (b1.size + b2.size) / 2 * CONFIG.mergeScale);
                                        const newBalloon = createBalloon(b1.text, {
                                            x: (b1.x + b2.x) / 2,
                                            y: (b1.y + b2.y) / 2,
                                            size: newSize,
                                            mergeCount: b1.mergeCount + b2.mergeCount,
                                            isRising: false,
                                            isNew: true
                                        });
                                        updateBalloonProps(newBalloon);
                                        // 合并后更新排行榜
                                        updateRanking();
                                    }, 500);
                                } else {
                                    clearPending(b1);
                                    clearPending(b2);
                                }
                            }, CONFIG.mergeWaitTime);

                            b1.mergeTimer = timer;
                            b2.mergeTimer = timer;
                            return;
                        }
                    }
                }
            });
        }

        // 动画主循环
        function animate() {
            balloons.forEach(balloon => {
                if (balloon.element.classList.contains('merging')) return;

                // 上升阶段
                if (balloon.isRising) {
                    balloon.y -= CONFIG.riseSpeed;
                    if (balloon.y <= balloon.targetY) {
                        balloon.isRising = false;
                    }
                }

                // 待合并状态不单独飘动
                if (!balloon.pendingMerge) {
                    // 所有气球飘动速度统一，不受大小影响
                    balloon.x += balloon.direction * CONFIG.floatSpeed;
                }

                // 边界循环
                if (balloon.x < -balloon.size) {
                    balloon.x = winWidth;
                } else if (balloon.x > winWidth) {
                    balloon.x = -balloon.size;
                }

                // 更新位置
                balloon.element.style.left = `${balloon.x}px`;
                balloon.element.style.top = `${balloon.y}px`;
            });

            handleMerge();
            requestAnimationFrame(animate);
        }

        // 放飞气球
        function flyBalloon() {
            const text = input.value.trim();
            if (!text) return;
            
            createBalloon(text, {
                x: winWidth / 2 - 30 + Math.random() * 60,
                isNew: true
            });
            
            input.value = '';
            input.focus();
        }

        // 初始化
        function init() {
            // 生成初始气球
            DEFAULT_TEXTS.forEach(text => {
                createBalloon(text, {
                    isRising: false
                });
            });

            // 绑定事件
            flyBtn.addEventListener('click', flyBalloon);
            input.addEventListener('keydown', e => e.key === 'Enter' && flyBalloon());
            
            // 排行榜折叠/展开
            toggleRanking.addEventListener('click', () => {
                rankingPanel.classList.toggle('collapsed');
            });

            window.addEventListener('resize', () => {
                winWidth = window.innerWidth;
                winHeight = window.innerHeight;
                // 窗口大小改变时重新计算所有气球的目标高度
                balloons.forEach(b => {
                    b.targetY = getTargetYBySize(b.size);
                });
            });

            // 启动动画
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
