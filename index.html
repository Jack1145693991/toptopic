<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>卡帕多奇亚热气球日出</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
#scene{position:fixed;top:0;left:0;width:100%;height:100%;background:url('assets/background.png') no-repeat center center;background-size:cover;z-index:0}
#scene::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.05) 0%,rgba(0,0,0,0.15) 100%);pointer-events:none}

/* --- Balloon Structure --- */
.balloon-outer{position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:grab;transition:filter .3s,opacity .3s}
.balloon-outer.dragging{cursor:grabbing;transition:none}
.balloon-outer.paused-anim{cursor:pointer}
.balloon-inner{display:flex;flex-direction:column;align-items:center;transform-origin:center center;transition:filter .3s,opacity .3s}
.balloon-inner.entering{animation:balloonEnter .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes balloonEnter{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.balloon-inner.merging-out{animation:mergeOut .5s ease-in forwards}
@keyframes mergeOut{to{opacity:0;transform:scale(0)}}

/* Envelope */
.envelope-box{position:relative;overflow:visible}
.envelope-box img{display:block;width:100%;pointer-events:none;-webkit-user-drag:none;user-select:none}
.balloon-text{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);color:#fff;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none;z-index:2;letter-spacing:1px}

/* Ropes */
.ropes-svg{display:block;flex-shrink:0}

/* Basket */
.basket{border-radius:3px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);flex-shrink:0;position:relative;overflow:hidden}
.basket .merge-count{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7);line-height:1;white-space:nowrap}
.basket.flashing{animation:basketFlash .3s ease-in-out infinite alternate}
@keyframes basketFlash{from{background-color:#8D6E63;border-color:#5D4037}to{background-color:#FF7043;border-color:#E64A19}}

/* Paused glow ring */
.balloon-inner.paused-ring::after{content:'';position:absolute;top:-4px;left:-4px;right:-4px;bottom:-4px;border-radius:50%;border:2px solid rgba(255,112,67,.6);animation:pauseRing 1.5s ease-in-out infinite}
@keyframes pauseRing{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.8;transform:scale(1.04)}}

/* --- Stats Panel --- */
#stats-panel{position:fixed;top:16px;left:16px;z-index:9998;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 18px;min-width:160px;max-height:60vh;overflow-y:auto;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.1)}
#stats-panel.hidden{opacity:0;transform:translateX(-200px);pointer-events:none}
#stats-toggle{position:fixed;top:16px;left:16px;z-index:9999;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#stats-toggle:hover{background:rgba(255,255,255,.28);transform:scale(1.1)}
#stats-panel:not(.hidden)~#stats-toggle{left:calc(16px + 180px)}
.stats-title{color:rgba(255,255,255,.9);font-size:13px;font-weight:700;margin-bottom:8px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.stats-title::before{content:'';display:inline-block;width:3px;height:14px;background:#FF7043;border-radius:2px}
.stats-total{color:rgba(255,255,255,.6);font-size:11px;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;color:rgba(255,255,255,.85);font-size:12px}
.stat-row .stat-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.stat-bar-bg{width:60px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;flex-shrink:0}
.stat-bar{height:100%;border-radius:3px;transition:width .3s}
.stat-count{color:rgba(255,255,255,.6);font-size:11px;width:28px;text-align:right;flex-shrink:0;margin-left:6px}
#stats-panel::-webkit-scrollbar{width:3px}
#stats-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}

/* --- Wind Control Panel --- */
#wind-panel{position:fixed;top:16px;right:16px;z-index:9998;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px 16px;width:170px;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.1)}
#wind-panel.hidden-wind{opacity:0;transform:translateX(200px);pointer-events:none}
#wind-toggle{position:fixed;top:16px;right:16px;z-index:9999;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.1)}
#wind-toggle:hover{background:rgba(255,255,255,.28);transform:scale(1.1)}
#wind-panel:not(.hidden-wind)~#wind-toggle{right:calc(16px + 186px)}
.wind-title{color:rgba(255,255,255,.9);font-size:13px;font-weight:700;margin-bottom:10px;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.wind-title::before{content:'';display:inline-block;width:3px;height:14px;background:#42A5F5;border-radius:2px}
.wind-row{margin-bottom:10px}
.wind-label{color:rgba(255,255,255,.7);font-size:11px;margin-bottom:5px;display:block}
.wind-dir-group{display:flex;gap:6px}
.wind-dir-btn{flex:1;height:32px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:8px;color:#fff;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.wind-dir-btn:hover{background:rgba(255,255,255,.18)}
.wind-dir-btn.active-wind{background:rgba(255,112,67,.4);border-color:rgba(255,112,67,.6)}
.wind-slider{-webkit-appearance:none;appearance:none;width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;outline:none;margin:6px 0}
.wind-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#FF7043;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.wind-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#FF7043;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.wind-range{display:flex;justify-content:space-between;color:rgba(255,255,255,.5);font-size:10px}
.wind-current{color:rgba(255,255,255,.85);font-size:13px;text-align:center;padding-top:4px;font-weight:700}
.wind-current span{color:#FF7043;font-size:16px}

/* Float button */
#btn-float-wrap{position:fixed;top:58px;right:16px;z-index:9998}
.ctrl-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.ctrl-btn:hover{background:rgba(255,255,255,.28);transform:scale(1.1)}
.ctrl-btn.active{background:rgba(255,112,67,.4);border-color:rgba(255,112,67,.6)}

/* --- Footer Link --- */
#footer-link{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:9999;color:rgba(255,255,255,.6);font-size:12px;text-decoration:none;transition:color .2s}
#footer-link:hover{color:rgba(255,255,255,.9)}

/* --- Input Area --- */
#input-area{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 20px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:50px;z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,.12)}
#balloon-input{width:300px;height:40px;padding:0 18px;border:none;border-radius:20px;background:rgba(255,255,255,.92);font-size:14px;color:#333;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);transition:box-shadow .2s}
#balloon-input:focus{box-shadow:inset 0 1px 3px rgba(0,0,0,.06),0 0 0 3px rgba(255,112,67,.2)}
#balloon-input::placeholder{color:#bbb}
#launch-btn{padding:10px 22px;border:none;border-radius:20px;background:linear-gradient(135deg,#FF7043,#FF5722);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s;white-space:nowrap;box-shadow:0 2px 8px rgba(255,87,34,.3);letter-spacing:1px}
#launch-btn:hover{background:linear-gradient(135deg,#F4511E,#E64A19);transform:translateY(-2px);box-shadow:0 4px 14px rgba(255,87,34,.4)}
#launch-btn:active{transform:translateY(0);box-shadow:0 2px 6px rgba(255,87,34,.3)}

@media(max-width:768px){
  #balloon-input{width:200px;font-size:13px}
  #launch-btn{padding:9px 16px;font-size:13px}
  #input-area{padding:6px 14px;gap:8px;bottom:20px}
  #stats-panel{padding:10px 14px;min-width:130px}
  #stats-panel:not(.hidden)~#stats-toggle{left:calc(16px + 150px)}
  #wind-panel{width:150px;padding:12px}
  #wind-panel:not(.hidden-wind)~#wind-toggle{right:calc(16px + 160px)}
}
</style>
</head>
<body>

<div id="scene"></div>

<!-- Stats Panel -->
<div id="stats-panel">
  <div class="stats-title">气球统计</div>
  <div class="stats-total" id="stats-total">共 0 个气球</div>
  <div id="stats-list"></div>
</div>
<button id="stats-toggle" title="统计">📊</button>

<!-- Wind Control Panel -->
<div id="wind-panel">
  <div class="wind-title">风力控制</div>
  <div class="wind-row">
    <span class="wind-label">风向</span>
    <div class="wind-dir-group">
      <button class="wind-dir-btn" data-dir="-1" title="向左">←</button>
      <button class="wind-dir-btn active-wind" data-dir="0" title="无风">·</button>
      <button class="wind-dir-btn" data-dir="1" title="向右">→</button>
    </div>
  </div>
  <div class="wind-row">
    <span class="wind-label">风速 (m/s)</span>
    <input type="range" class="wind-slider" id="wind-slider" min="0" max="5" step="0.1" value="0">
    <div class="wind-range"><span>0</span><span>5</span></div>
    <div class="wind-current"><span id="wind-val">0.0</span> m/s</div>
  </div>
</div>
<button id="wind-toggle" title="风力设置">🌬</button>

<!-- Float button -->
<div id="btn-float-wrap">
  <button class="ctrl-btn active" id="btn-float" title="飘动开关">💨</button>
</div>

<!-- Input -->
<div id="input-area">
  <input type="text" id="balloon-input" placeholder="写下你想放飞的文字..." maxlength="8">
  <button id="launch-btn">放飞热气球</button>
</div>

<!-- TopTopic Link -->
<a id="footer-link" href="https://www.toptopic.net" target="_blank" rel="noopener">TopTopic</a>

<script>
/* ===================== CONFIG ===================== */
const CFG = {
  SIZE_MIN: 65,
  SIZE_MAX: 160,
  ENVELOPE_H_RATIO: 1.22,   // matches actual balloon image aspect ratio (H/W)
  ROPE_H: 14,
  BASKET_W_RATIO: 0.32,
  BASKET_H: 18,
  RISE_SPEED: 1.2,
  SWAY_AMP: 4,
  SWAY_PERIOD: 5000,
  DRIFT_SPEED: 0.2,
  MERGE_DIST: 25,
  MERGE_CANCEL_DIST: 55,
  MERGE_WAIT: 1000,
  MERGE_GROW: 1.2,
  ATTRACT_SPEED: 180,
  INIT_COUNT: 24,
  H_MIN: 0.15,
  H_MAX: 0.70,
  ENTRANCE_MS: 500,
  EXIT_MS: 500,
  PAUSE_MS: 10000,
  WIND_MAX: 5,
};

/* ============= BALLOON VISUAL STYLES ============= */
const STYLES = [
  { img:'balloon01.png', filter:'none' },
  { img:'balloon02.png', filter:'none' },
  { img:'balloon03.png', filter:'none' },
  { img:'balloon04.png', filter:'none' },
  { img:'balloon01.png', filter:'hue-rotate(50deg) saturate(1.25)' },
  { img:'balloon01.png', filter:'hue-rotate(130deg) saturate(1.15)' },
  { img:'balloon02.png', filter:'hue-rotate(85deg)' },
  { img:'balloon02.png', filter:'hue-rotate(200deg) saturate(.9)' },
  { img:'balloon03.png', filter:'hue-rotate(65deg) brightness(1.08)' },
  { img:'balloon03.png', filter:'hue-rotate(175deg) saturate(1.2)' },
  { img:'balloon04.png', filter:'hue-rotate(185deg)' },
  { img:'balloon04.png', filter:'hue-rotate(250deg) saturate(1.25)' },
];

/* ============== DEFAULT TEXTS ============== */
const DEFAULT_TEXTS = [
  '浪漫','自由','旅行','平安','暴富','健康',
  '幸福','快乐','梦想','勇气','希望','感恩',
  '爱情','友情','成长','幸运','坚强','智慧',
  '温暖','美好','守护','祝福','心想事成','前程似锦',
];

/* ============== 3D DEPTH (no blur!) ============== */
function get3D(size) {
  const t = (size - CFG.SIZE_MIN) / (CFG.SIZE_MAX - CFG.SIZE_MIN); // 0=small(near) 1=large(far)
  return {
    opacity:  1,                  // all balloons fully opaque
    bright:   1 + (1 - t) * 0.10, // near balloons slightly brighter
    scale:    0.88 + t * 0.12,    // far balloons slightly larger in "perspective"
    yOffset:  t * 6,              // far balloons slightly higher (ground perspective)
  };
}

/* ================== STATE ================== */
let balloons = [];
let nextId = 0;
let floatEnabled = true;

// User-controlled wind
let windDir = 0;      // -1 = left, 0 = none, 1 = right
let windSpeed = 0;    // 0 ~ 5

const sceneEl   = document.getElementById('scene');
const inputEl   = document.getElementById('balloon-input');
const btnEl     = document.getElementById('launch-btn');
const statsPanel = document.getElementById('stats-panel');
const statsToggle = document.getElementById('stats-toggle');
const btnFloat  = document.getElementById('btn-float');
const windPanel = document.getElementById('wind-panel');
const windToggle = document.getElementById('wind-toggle');
const windSlider = document.getElementById('wind-slider');
const windValEl = document.getElementById('wind-val');

/* ============= HELPERS ============= */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/* =========== CREATE BALLOON =========== */
function createBalloon(text, opts = {}) {
  const id = nextId++;
  const W = window.innerWidth, H = window.innerHeight;
  const size = opts.size || rand(CFG.SIZE_MIN, CFG.SIZE_MAX);
  const si   = opts.styleIndex !== undefined ? opts.styleIndex : randInt(0, STYLES.length - 1);

  const envW = size;
  const envH = size * CFG.ENVELOPE_H_RATIO;
  const bskW = size * CFG.BASKET_W_RATIO;
  const ropeH = Math.max(10, Math.round(size * 0.10));
  const bskH = Math.max(18, Math.round(size * 0.18));
  const totalH = envH + ropeH + bskH;

  const x = opts.x !== undefined ? opts.x : rand(0, W - size);
  const targetY = opts.targetY !== undefined
    ? opts.targetY
    : rand(CFG.H_MIN, CFG.H_MAX) * H;

  const d3 = get3D(size);

  const b = {
    id, text, size, si,
    x, y: opts.rise ? H + totalH + 20 : targetY,
    targetY,
    mergeCount: opts.mergeCount || 1,
    driftDir: Math.random() > .5 ? 1 : -1,
    swayPhase: Math.random() * Math.PI * 2,
    state: opts.rise ? 'rising' : 'floating',
    entering: !opts.noEntry,
    mergePartner: null,
    mergeTimer: null,
    envW, envH, bskW, ropeH, bskH, totalH,
    zIndex: Math.round(1000 - size * 4),
    d3,
    paused: false,
    pauseTimer: null,
    dragging: false,
    dragOX: 0, dragOY: 0,
  };

  b.el = buildDOM(b);
  b.ghostEl = buildDOM(b);        // mirror for seamless edge wrap
  b.ghostEl.style.display = 'none'; // hidden by default
  b.ghostEl.style.pointerEvents = 'none';
  apply3D(b);
  sceneEl.appendChild(b.el);
  sceneEl.appendChild(b.ghostEl);
  moveEl(b);

  if (b.entering) {
    b.inner.classList.add('entering');
    setTimeout(() => { b.inner.classList.remove('entering'); b.entering = false; }, CFG.ENTRANCE_MS);
  }

  setupBalloonInteraction(b);
  balloons.push(b);
  updateStats();
  return b;
}

/* =========== BUILD DOM =========== */
function buildDOM(b) {
  const s = STYLES[b.si];
  const fontSize = Math.max(10, b.size * 0.15);

  const outer = document.createElement('div');
  outer.className = 'balloon-outer';

  const inner = document.createElement('div');
  inner.className = 'balloon-inner';
  if (!b.entering) {
    inner.style.opacity = '1';
    inner.style.transform = 'scale(1)';
  }
  b.inner = inner;

  // Envelope
  const envBox = document.createElement('div');
  envBox.className = 'envelope-box';
  envBox.style.width  = b.envW + 'px';
  envBox.style.height = b.envH + 'px';

  const img = document.createElement('img');
  img.src = 'assets/' + s.img;
  if (s.filter !== 'none') img.style.filter = s.filter;
  img.style.width  = b.envW + 'px';
  img.style.height = b.envH + 'px';
  img.style.display = 'block';
  img.draggable = false;

  const txt = document.createElement('span');
  txt.className = 'balloon-text';
  txt.textContent = b.text;
  txt.style.fontSize = fontSize + 'px';
  b.textEl = txt;

  envBox.appendChild(img);
  envBox.appendChild(txt);

  // Ropes fan from envelope bottom (narrow) to basket (wider), like real balloons
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'ropes-svg');
  svg.setAttribute('width', b.envW);
  svg.setAttribute('height', b.ropeH);
  svg.style.display = 'block';

  const bskLeft  = (b.envW - b.bskW) / 2;
  const bskRight = bskLeft + b.bskW;

  // Top start: narrow band at envelope bottom (~35% of envelope width, centered)
  const topSpread = b.envW * 0.35;
  const topStart  = (b.envW - topSpread) / 2;
  const ropes = [
    // outer-left
    [topStart,                    0, bskLeft,                      b.ropeH],
    // mid-left
    [topStart + topSpread * 0.30, 0, bskLeft + b.bskW * 0.18,      b.ropeH],
    // center-left
    [topStart + topSpread * 0.50, 0, bskLeft + b.bskW * 0.40,      b.ropeH],
    // center-right
    [topStart + topSpread * 0.50, 0, bskRight - b.bskW * 0.40,     b.ropeH],
    // mid-right
    [topStart + topSpread * 0.70, 0, bskRight - b.bskW * 0.18,     b.ropeH],
    // outer-right
    [topStart + topSpread,        0, bskRight,                     b.ropeH],
  ];
  ropes.forEach(([x1, y1, x2, y2], idx) => {
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', x1.toFixed(1)); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2.toFixed(1)); line.setAttribute('y2', y2);
    const isOuter = (idx === 0 || idx === ropes.length - 1);
    line.setAttribute('stroke', isOuter ? 'rgba(110,90,70,.65)' : 'rgba(130,110,90,.45)');
    line.setAttribute('stroke-width', Math.max(0.6, b.size / (isOuter ? 150 : 220)).toFixed(1));
    svg.appendChild(line);
  });

  // Basket
  const basket = document.createElement('div');
  basket.className = 'basket';
  basket.style.width      = b.bskW + 'px';
  basket.style.height     = b.bskH + 'px';
  basket.style.background = '#8D6E63';
  basket.style.borderTop  = '2px solid #5D4037';

  const mc = document.createElement('span');
  mc.className = 'merge-count';
  mc.style.fontSize = Math.max(10, Math.round(b.bskH * 0.55)) + 'px';
  mc.textContent = b.mergeCount > 1 ? '\u00d7' + b.mergeCount : '';
  basket.appendChild(mc);
  b.basketEl = basket;
  b.mcEl = mc;

  inner.appendChild(envBox);
  inner.appendChild(svg);
  inner.appendChild(basket);
  outer.appendChild(inner);
  outer.style.zIndex = b.zIndex;

  return outer;
}

/* =========== 3D EFFECT (no blur!) =========== */
function apply3D(b) {
  const d = b.d3;
  // Only brightness + opacity, NO blur
  b.inner.style.filter = 'brightness(' + d.bright.toFixed(2) + ')';
  b.inner.style.opacity = d.opacity.toFixed(2);
  // Add subtle depth shadow via box-shadow on the whole balloon
  b.el.style.boxShadow = 'none';
  // Scale for perspective (far = larger)
  // But we don't scale the text, so we apply scale on inner
  // Keep it subtle
}

/* =========== MOVE ELEMENT + GHOST =========== */
function moveEl(b) {
  const tf = 'translate3d(' + b.x + 'px,' + b.y + 'px,0)';
  b.el.style.transform = tf;

  // Ghost: show wrapped copy when balloon straddles an edge
  const W = window.innerWidth;
  let ghostX = null;
  if (b.x + b.size > W && b.x < W) {
    // Right part off-screen → ghost on left
    ghostX = b.x - W;
  } else if (b.x < 0 && b.x + b.size > 0) {
    // Left part off-screen → ghost on right
    ghostX = b.x + W;
  }
  if (ghostX !== null) {
    b.ghostEl.style.display = '';
    b.ghostEl.style.transform = 'translate3d(' + ghostX + 'px,' + b.y + 'px,0)';
  } else {
    b.ghostEl.style.display = 'none';
  }
}

/* =========== WRAP AROUND =========== */
function wrapAround(b, W) {
  // Only wrap when the balloon is FULLY off-screen (ghost takes over visually)
  if (b.x >= W) {
    b.x -= W;
  } else if (b.x + b.size <= 0) {
    b.x += W;
  }
}

/* =========== REMOVE BALLOON =========== */
function killBalloon(b) {
  b.state = 'dead';
  if (b.mergeTimer) { clearTimeout(b.mergeTimer); b.mergeTimer = null; }
  if (b.pauseTimer) { clearTimeout(b.pauseTimer); b.pauseTimer = null; }
  cancelMergeVisual(b);
  if (b.el && b.el.parentNode) b.el.parentNode.removeChild(b.el);
  if (b.ghostEl && b.ghostEl.parentNode) b.ghostEl.parentNode.removeChild(b.ghostEl);
  balloons = balloons.filter(bb => bb.id !== b.id);
  updateStats();
}

function cancelMergeVisual(b) {
  b.mergePartner = null;
  if (b.basketEl) b.basketEl.classList.remove('flashing');
}

/* =============== BALLOON INTERACTION =============== */
function setupBalloonInteraction(b) {
  let isDrag = false;
  let startX = 0, startY = 0;
  let origX = 0, origY = 0;
  let moved = false;

  const onDown = (e) => {
    if (b.state === 'dead' || b.state === 'merging' || b.entering) return;
    e.preventDefault();
    const ev = e.touches ? e.touches[0] : e;
    isDrag = true;
    moved = false;
    startX = ev.clientX;
    startY = ev.clientY;
    origX = b.x;
    origY = b.y;
    b.dragging = true;
    b.el.classList.add('dragging');
    if (b.pauseTimer) { clearTimeout(b.pauseTimer); b.pauseTimer = null; }
  };

  const onMove = (e) => {
    if (!isDrag) return;
    e.preventDefault();
    const ev = e.touches ? e.touches[0] : e;
    const dx = ev.clientX - startX;
    const dy = ev.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 5) moved = true;
    b.x = origX + dx;
    b.targetY = b.y = origY + dy;
    moveEl(b);
  };

  const onUp = (e) => {
    if (!isDrag) return;
    isDrag = false;
    b.dragging = false;
    b.el.classList.remove('dragging');

    if (!moved) {
      pauseBalloon(b);
    } else {
      const W = window.innerWidth, H = window.innerHeight;
      b.targetY = clamp(b.targetY, H * CFG.H_MIN, H * CFG.H_MAX);
    }
  };

  b.el.addEventListener('mousedown', onDown);
  b.el.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
}

function pauseBalloon(b) {
  if (b.paused) return;
  b.paused = true;
  b.inner.classList.add('paused-ring');
  b.el.classList.add('paused-anim');
  if (b.pauseTimer) clearTimeout(b.pauseTimer);
  b.pauseTimer = setTimeout(() => {
    b.paused = false;
    b.inner.classList.remove('paused-ring');
    b.el.classList.remove('paused-anim');
    b.pauseTimer = null;
  }, CFG.PAUSE_MS);
}

/* =============== ANIMATION LOOP =============== */
let lastT = 0;
function loop(ts) {
  if (!lastT) lastT = ts;
  lastT = ts;
  const W = window.innerWidth, H = window.innerHeight;

  // Wind force from user controls (px per frame)
  const windForce = windDir * windSpeed * 0.5; // max 2.5 px/frame at 5 m/s

  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (b.state === 'dead' || b.state === 'merging' || b.entering) continue;
    if (b.dragging || b.paused) continue;

    // Rising
    if (b.state === 'rising') {
      b.y -= CFG.RISE_SPEED;
      if (b.y <= b.targetY) { b.y = b.targetY; b.state = 'floating'; }
    }

    // Sway & drift only when floating
    if (b.state === 'floating' && floatEnabled) {
      b.y = b.targetY + Math.sin((ts / CFG.SWAY_PERIOD) * Math.PI * 2 + b.swayPhase) * CFG.SWAY_AMP;

      let drift = b.driftDir * CFG.DRIFT_SPEED;
      // User wind
      if (windForce !== 0) drift += windForce * (CFG.ATTRACT_SPEED / b.size) * 0.2;
      b.x += drift;
    }

    wrapAround(b, W);
    moveEl(b);
  }

  processMerges();
  requestAnimationFrame(loop);
}

/* =============== MERGE LOGIC =============== */
function processMerges() {
  const groups = {};
  for (const b of balloons) {
    if (b.state !== 'floating' || b.entering || b.paused || b.dragging) continue;
    (groups[b.text] || (groups[b.text] = [])).push(b);
  }

  for (const txt in groups) {
    const g = groups[txt];
    if (g.length < 2) continue;

    for (let i = 0; i < g.length; i++) {
      const a = g[i];
      if (a.mergePartner !== null) continue;

      let best = null, bestD = Infinity;
      for (let j = 0; j < g.length; j++) {
        if (i === j) continue;
        const c = g[j];
        if (c.mergePartner !== null && c.mergePartner !== a.id) continue;
        const cx = c.x + c.envW / 2, cy = c.y + c.totalH / 2;
        const ax = a.x + a.envW / 2, ay = a.y + a.totalH / 2;
        const d = Math.hypot(cx - ax, cy - ay);
        if (d < bestD) { bestD = d; best = c; }
      }
      if (!best) continue;

      const bx = best.x + best.envW / 2, by = best.y + best.totalH / 2;
      const ax = a.x + a.envW / 2, ay = a.y + a.totalH / 2;
      const d = Math.hypot(bx - ax, by - ay);

      if (d > CFG.MERGE_DIST) {
        if (a.paused || best.paused || a.dragging || best.dragging) continue;
        const dx = (bx - ax) / d, dy = (by - ay) / d;
        const sa = CFG.ATTRACT_SPEED / a.size;
        const sb = CFG.ATTRACT_SPEED / best.size;
        a.x += dx * sa;  a.y += dy * sa;  a.targetY += dy * sa;
        best.x -= dx * sb; best.y -= dy * sb; best.targetY -= dy * sb;

        if (a.mergePartner === best.id && d > CFG.MERGE_CANCEL_DIST) {
          cancelMergeVisual(a);
          cancelMergeVisual(best);
        }
      } else if (a.mergePartner !== best.id) {
        a.mergePartner = best.id;
        best.mergePartner = a.id;
        a.basketEl.classList.add('flashing');
        best.basketEl.classList.add('flashing');

        a.mergeTimer = setTimeout(() => {
          if (a.state === 'floating' && best.state === 'floating' && a.mergePartner === best.id) {
            doMerge(a, best);
          } else {
            cancelMergeVisual(a);
            cancelMergeVisual(best);
          }
        }, CFG.MERGE_WAIT);
      }
    }
  }
}

function doMerge(a, b) {
  a.state = 'merging';
  b.state = 'merging';
  a.inner.classList.add('merging-out');
  b.inner.classList.add('merging-out');

  setTimeout(() => {
    const newSz = clamp(Math.max(a.size, b.size) * CFG.MERGE_GROW, CFG.SIZE_MIN, CFG.SIZE_MAX * 1.5);
    const newX  = (a.x + a.envW / 2 + b.x + b.envW / 2) / 2 - newSz / 2;
    const newY  = (a.targetY + b.targetY) / 2;
    const newMC = a.mergeCount + b.mergeCount;

    killBalloon(a);
    killBalloon(b);

    const merged = createBalloon(a.text, {
      x: newX, targetY: newY, size: newSz,
      mergeCount: newMC, noEntry: false,
      styleIndex: a.size >= b.size ? a.si : b.si,
    });
    merged.state = 'floating';
    merged.y = merged.targetY;
    moveEl(merged);
  }, CFG.EXIT_MS);
}

/* =============== STATS PANEL =============== */
let statsVisible = true;

function updateStats() {
  const counts = {};
  balloons.forEach(b => { if (b.state !== 'dead') counts[b.text] = (counts[b.text] || 0) + b.mergeCount; });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const maxCount = sorted.length > 0 ? sorted[0][1] : 1;

  document.getElementById('stats-total').textContent = '\u5171 ' + balloons.filter(b => b.state !== 'dead').length + ' \u4e2a\u6c14\u7403';

  const listEl = document.getElementById('stats-list');
  const colors = ['#FF7043','#FFA726','#FFEE58','#66BB6A','#42A5F5','#AB47BC','#EC407A','#26C6DA','#8D6E63','#78909C'];
  let html = '';
  sorted.slice(0, 15).forEach(([text, count], i) => {
    const pct = (count / maxCount * 100).toFixed(0);
    const c = colors[i % colors.length];
    html += '<div class="stat-row">'
      + '<span class="stat-text">' + text + '</span>'
      + '<div class="stat-bar-bg"><div class="stat-bar" style="width:' + pct + '%;background:' + c + '"></div></div>'
      + '<span class="stat-count">\u00d7' + count + '</span>'
      + '</div>';
  });
  listEl.innerHTML = html;
}

statsToggle.addEventListener('click', () => {
  statsVisible = !statsVisible;
  statsPanel.classList.toggle('hidden', !statsVisible);
});
setInterval(updateStats, 2000);

/* =============== WIND CONTROL =============== */
let windPanelVisible = true;

windToggle.addEventListener('click', () => {
  windPanelVisible = !windPanelVisible;
  windPanel.classList.toggle('hidden-wind', !windPanelVisible);
});

// Direction buttons
const dirBtns = document.querySelectorAll('.wind-dir-btn');
dirBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const d = parseInt(btn.dataset.dir, 10);
    windDir = d;
    dirBtns.forEach(b => b.classList.remove('active-wind'));
    btn.classList.add('active-wind');
  });
});

// Speed slider
windSlider.addEventListener('input', () => {
  const v = parseFloat(windSlider.value);
  windSpeed = clamp(v, 0, CFG.WIND_MAX);
  windValEl.textContent = windSpeed.toFixed(1);
});

/* =============== FLOAT BUTTON =============== */
btnFloat.addEventListener('click', () => {
  floatEnabled = !floatEnabled;
  btnFloat.classList.toggle('active', floatEnabled);
});

/* =============== API (CloudBase Cloud Function) =============== */
const API_BASE = 'https://fba-d6gxj9vyg9553eb76-1344228588.tcloudbaseapp.com';

async function loadHistory() {
  try {
    const res = await fetch(API_BASE + '/balloon-api');
    const data = await res.json();
    if (data && data.code === 0 && Array.isArray(data.data) && data.data.length > 0) {
      const recs = data.data.slice(0, 100);
      recs.forEach((r, i) => { setTimeout(() => createBalloon(r.text, { noEntry: false }), i * 80); });
      return;
    }
  } catch (_) { /* fallback below */ }

  DEFAULT_TEXTS.forEach((t, i) => {
    setTimeout(() => createBalloon(t, { noEntry: false }), i * 100);
  });
}

async function saveRecord(text) {
  try {
    await fetch(API_BASE + '/balloon-api', { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ action:'save', text }) });
  } catch (_) { /* silent */ }
}

/* =============== INPUT =============== */
function setupInput() {
  const launch = () => {
    const t = inputEl.value.trim();
    if (!t) return;
    createBalloon(t, { rise: true });
    saveRecord(t);
    inputEl.value = '';
    inputEl.focus();
  };
  btnEl.addEventListener('click', launch);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') launch(); });
}

/* =============== RESIZE =============== */
window.addEventListener('resize', () => {
  const W = window.innerWidth, H = window.innerHeight;
  balloons.forEach(b => {
    if (b.state === 'dead' || b.state === 'merging') return;
    b.x = clamp(b.x, -b.size * 2, W + b.size);
    b.targetY = clamp(b.targetY, H * CFG.H_MIN, H * CFG.H_MAX);
  });
});

/* =============== INIT =============== */
window.addEventListener('load', () => {
  setupInput();
  loadHistory();
  requestAnimationFrame(loop);
});
</script>
